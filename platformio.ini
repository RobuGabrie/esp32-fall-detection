[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -I src/merged
build_src_filter = +<main.cpp> +<merged/>
board_build.f_cpu = 80000000L
; Default partition gives only 1.3MB to app. BLE + Edge Impulse SDK exceeds it.
; huge_app.csv = 3MB app / no OTA / 1MB SPIFFS — plenty of headroom for ML + BLE.
board_build.partitions = huge_app.csv
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9
    protocentral/ProtoCentral MAX30205 Body Temperature Sensor Library @ ^2.1.2
    sparkfun/SparkFun Bio Sensor Hub Library @ ^1.1.0

